<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090c13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cola Sort">
<title>Cola Sort</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090c13;
    --panel: #141a25;
    --text: #f5f7fb;
    --muted: #98a1b1;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); }

  body {
    height: 100svh;
    overflow: hidden;
    padding: max(10px,env(safe-area-inset-top))
             max(12px,env(safe-area-inset-right))
             max(12px,env(safe-area-inset-bottom))
             max(12px,env(safe-area-inset-left));
    color: var(--text);
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  button { color: inherit; font: inherit; }
  .app { width: min(100%,900px); height: 100%; margin: auto; display: flex; flex-direction: column; }

  header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 1px 12px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-icon {
    width:39px; height:39px; display:grid; place-items:center; border-radius:13px;
    background:linear-gradient(145deg,#ff7469,#b91f29); box-shadow:0 5px 20px #ed393a44; font-size:21px;
  }
  h1 { margin:0; font-size:20px; letter-spacing:-.5px; }
  .subtitle { margin-top:2px; color:var(--muted); font-size:11px; }
  .header-buttons { display:flex; gap:8px; }

  .icon-button,.button {
    min-height:43px; border:1px solid #ffffff16; border-radius:13px;
    background:#ffffff09; cursor:pointer; touch-action:manipulation;
  }
  .icon-button { width:44px; font-size:18px; }
  .button { padding:0 13px; font-size:13px; }
  .button:active,.icon-button:active { transform:scale(.97); }
  .button.primary { background:#e74343; border-color:#ff777066; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { padding:8px 5px; text-align:center; border:1px solid #ffffff12; border-radius:13px; background:var(--panel); }
  .stat strong { display:block; font-size:16px; }
  .stat span { display:block; margin-top:2px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.7px; }
  .progress { height:4px; margin:12px 2px 5px; overflow:hidden; border-radius:8px; background:#ffffff14; }
  .progress-fill { width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,#ec4545,#ffd06a); transition:width .3s; }

  .board-area { flex:1; min-height:0; display:grid; place-items:center; }
  .board {
    width:100%; display:grid; grid-template-columns:repeat(var(--columns,4),minmax(0,1fr));
    justify-items:center; align-items:center; gap:clamp(5px,2.5vh,18px) 2px; padding:10px 0;
  }

  .bottle-button {
    width:min(19vw,82px); min-width:49px; height:clamp(145px,27vh,205px);
    padding:0; border:0; background:transparent; cursor:pointer; touch-action:manipulation;
    transition:transform .2s ease,filter .2s ease;
  }
  .bottle-button.selected { transform:translateY(-10px); filter:drop-shadow(0 0 11px #74dfff77); }
  .bottle-button:focus { outline:none; }
  .bottle-svg { width:100%; height:100%; overflow:visible; }
  .empty-glow { animation:glow 2.4s ease-in-out infinite; }
  @keyframes glow {
    0%,100% { filter:drop-shadow(0 0 2px #7ee4ff10); }
    50% { filter:drop-shadow(0 0 10px #7ee4ff38); }
  }
  .bottle-label { font:bold 10px Georgia,serif; letter-spacing:1px; fill:white; }
  .cap { animation:cap-in .22s ease-out both; transform-origin:center; }
  @keyframes cap-in {
    from { transform:translateY(-8px) rotate(-12deg); opacity:.2; }
    to { transform:translateY(0) rotate(0); opacity:1; }
  }

  .controls { display:flex; justify-content:center; gap:8px; padding:5px 0 7px; }
  .hint { min-height:20px; padding-bottom:5px; text-align:center; color:var(--muted); font-size:12px; }

  .modal {
    position:fixed; z-index:10; inset:0; display:none; place-items:center; padding:20px;
    background:#05070bdb; backdrop-filter:blur(9px);
  }
  .modal.open { display:grid; }
  .card {
    width:min(370px,100%); max-height:80svh; overflow:auto; padding:23px;
    border:1px solid #ffffff20; border-radius:22px; background:#151c28; text-align:center;
  }
  .card h2 { margin:3px 0 8px; }
  .card p { color:var(--muted); font-size:14px; }
  .level-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .level-choice {
    aspect-ratio:1; border:1px solid #ffffff1c; border-radius:11px;
    background:#ffffff09; cursor:pointer;
  }
  .level-choice.available { border-color:#fa656077; background:#ef48451c; }
  .level-choice:disabled { opacity:.35; }

  .pour-layer { position:fixed; z-index:8; inset:0; pointer-events:none; }
  .particle-layer { position:fixed; z-index:12; inset:0; pointer-events:none; }
  .particle { position:absolute; font-size:17px; animation:particle .7s ease-out forwards; }
  @keyframes particle {
    to { transform:translate(var(--x),var(--y)) scale(.4) rotate(90deg); opacity:0; }
  }
  .toast {
    position:fixed; z-index:20; top:15%; left:50%; transform:translate(-50%,-8px);
    opacity:0; padding:10px 15px; border:1px solid #ffffff22; border-radius:13px;
    background:#1a2230; transition:opacity .2s,transform .2s; pointer-events:none;
  }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  @media (min-width:700px) {
    .bottle-button { width:70px; height:190px; }
    .board { gap:16px 14px; }
  }
  @media (max-height:620px) {
    header { padding-bottom:6px; }
    .bottle-button { height:clamp(105px,25vh,150px); }
    .progress { margin-top:8px; }
    .board { gap:5px 2px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-icon">🥤</div>
      <div><h1>Cola Sort</h1><div class="subtitle">Sortiere die Farben in die Flaschen.</div></div>
    </div>
    <div class="header-buttons">
      <button class="icon-button" id="soundButton" aria-label="Ton umschalten">🔊</button>
      <button class="icon-button" id="fullscreenButton" aria-label="Vollbild">⛶</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><strong id="levelText">1 / 20</strong><span>Level</span></div>
    <div class="stat"><strong id="scoreText">0</strong><span>Punkte</span></div>
    <div class="stat"><strong id="movesText">0</strong><span>Züge</span></div>
  </section>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

  <main class="board-area"><div class="board" id="board"></div></main>

  <div class="hint" id="hint">Tippe auf eine gefüllte Flasche, dann auf eine passende Flasche.</div>
  <nav class="controls">
    <button class="button" id="undoButton">↶ Rückgängig</button>
    <button class="button" id="restartButton">↻ Neustart</button>
    <button class="button" id="levelsButton">Level wählen</button>
  </nav>
</div>

<svg class="pour-layer" id="pourSvg" aria-hidden="true"></svg>
<div class="particle-layer" id="particles"></div>
<div class="toast" id="toast"></div>

<div class="modal" id="levelsModal">
  <div class="card">
    <h2>Level wählen</h2>
    <p>Neue Level werden nach und nach freigeschaltet.</p>
    <div class="level-grid" id="levelGrid"></div>
    <button class="button" id="closeLevels" style="margin-top:15px">Schließen</button>
  </div>
</div>

<div class="modal" id="winModal">
  <div class="card">
    <div style="font-size:42px">🏆</div>
    <h2 id="winTitle">Level geschafft!</h2>
    <p id="winMessage"></p>
    <button class="button primary" id="nextLevelButton">Weiter →</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const CAPACITY = 4;
  const COLORS = ["#ef3945","#f57a31","#ffd044","#71c953","#24b8a9",
                  "#3999e8","#7867e9","#d653b5","#b87950","#a2b8c8"];
  const SAVE_KEY = "cola-sort-ipad-save-v2";
  const SHAPE = "M36 12 Q36 8 40 8 L60 8 Q64 8 64 12 L64 61 Q64 71 70 78 L83 91 Q91 99 91 112 L91 205 Q91 222 76 226 L24 226 Q9 222 9 205 L9 112 Q9 99 17 91 L30 78 Q36 71 36 61 Z";

  const $ = id => document.getElementById(id);
  let game = null;
  let audioContext = null;
  let soundEnabled = true;
  let animationFrame = 0;
  let saved = readSave();
  soundEnabled = saved.sound;

  function readSave() {
    try {
      const data = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
      return {
        unlocked: Math.min(20, Math.max(1, Number(data.unlocked) || 1)),
        sound: data.sound !== false
      };
    } catch {
      return { unlocked: 1, sound: true };
    }
  }

  function saveGame() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(saved)); } catch {}
  }

  function seededRandom(seed) {
    let value = seed >>> 0;
    return () => {
      value = (value * 1664525 + 1013904223) >>> 0;
      return value / 4294967296;
    };
  }

  // Erst gelöste Flaschen aufbauen. Dann beim Erzeugen des Rätsels
  // einzelne oberste Segmente rückwärts umfüllen. Dadurch entstehen
  // gemischte Flaschen. Jeder Rückweg ist ein legaler Spielzug.
  function makeLevel(level) {
    const colorCount = Math.min(3 + Math.floor((level - 1) / 2), COLORS.length);
    const random = seededRandom(9301 + level * 7127);
    const tubes = Array.from({ length: colorCount + 2 }, (_, i) =>
      i < colorCount ? Array(CAPACITY).fill(i) : []
    );

    let previous = "";

    for (let step = 0; step < 28 + level * 5; step++) {
      const choices = [];

      for (let from = 0; from < tubes.length; from++) {
        if (tubes[from].length === 0) continue;
        const color = tubes[from][tubes[from].length - 1];

        for (let to = 0; to < tubes.length; to++) {
          if (from === to || tubes[to].length >= CAPACITY) continue;

          const top = tubes[to][tubes[to].length - 1];
          // Beim Zurückwärts-Mischen gezielt auf eine andere Farbe legen.
          // Im Spiel kann dieses Segment dann legal zurückgegossen werden.
          if (top !== undefined && top === color) continue;
          if (previous === `${to}-${from}`) continue;

          choices.push({ from, to });
        }
      }

      if (choices.length === 0) break;

      const move = choices[Math.floor(random() * choices.length)];
      const color = tubes[move.from].pop();
      tubes[move.to].push(color);
      previous = `${move.from}-${move.to}`;
    }

    return tubes.map(tube => tube.slice());
  }

  function startLevel(level) {
    if (animationFrame) cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    $("pourSvg").innerHTML = "";

    const initial = makeLevel(level);
    game = {
      level,
      tubes: initial.map(tube => tube.slice()),
      selected: null,
      moves: 0,
      score: 0,
      history: [],
      busy: false
    };

    $("levelsModal").classList.remove("open");
    $("winModal").classList.remove("open");
    render();
    updateStats();
  }

  function isComplete(tube) {
    return tube.length === 0 ||
      (tube.length === CAPACITY && tube.every(color => color === tube[0]));
  }

  function canPour(from, to) {
    if (from === to || !game.tubes[from].length || game.tubes[to].length >= CAPACITY) return false;
    const sourceColor = game.tubes[from][game.tubes[from].length - 1];
    const target = game.tubes[to];
    return target.length === 0 || target[target.length - 1] === sourceColor;
  }

  function renderBottle(tube, index) {
    // Arrayindex 0 ist der Flaschenboden. Die Farben werden deshalb
    // von unten nach oben gezeichnet und bleiben im Spiel korrekt sortiert.
    const layers = tube.map((color, layerIndex) => {
      const y = 226 - (layerIndex + 1) * 29;
      return `<rect x="10" y="${y}" width="80" height="30" fill="${COLORS[color]}"/>`;
    }).join("");

    const isFull = tube.length === CAPACITY && tube.every(c => c === tube[0]);
    const selected = game.selected === index ? "selected" : "";
    const empty = tube.length === 0 ? "empty-glow" : "";

    const label = isFull
      ? `<rect x="14" y="137" width="72" height="26" rx="5" fill="#bd2229" stroke="#ffb2a0" stroke-width="1"/>
         <text x="50" y="154" text-anchor="middle" class="bottle-label">COLA</text>`
      : "";

    const cap = isFull
      ? `<g class="cap">
           <rect x="37" y="3" width="26" height="10" rx="3" fill="#df3b32" stroke="#ff9c75" stroke-width="1"/>
           <path d="M41 4V12 M47 4V12 M53 4V12 M59 4V12" stroke="#ff9c75" stroke-width="1"/>
         </g>`
      : "";

    return `
      <button class="bottle-button ${selected}" data-bottle="${index}" aria-label="Flasche ${index + 1}">
        <svg class="bottle-svg ${empty}" viewBox="0 0 100 234" role="img">
          <defs>
            <clipPath id="clip-${index}"><path d="${SHAPE}"/></clipPath>
            <linearGradient id="glass-${index}" x1="0" x2="1">
              <stop offset="0" stop-color="#d9f4ff" stop-opacity=".22"/>
              <stop offset=".2" stop-color="#ffffff" stop-opacity=".035"/>
              <stop offset=".72" stop-color="#ffffff" stop-opacity=".11"/>
              <stop offset="1" stop-color="#c9edff" stop-opacity=".18"/>
            </linearGradient>
          </defs>
          <g clip-path="url(#clip-${index})">
            ${layers}
            <rect x="0" y="0" width="100" height="234" fill="url(#glass-${index})"/>
            <path d="M20 102 Q18 105 18 117 L18 204 Q18 216 27 218" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="4" stroke-linecap="round"/>
            <path d="M78 102 Q82 106 82 117 L82 199" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="3" stroke-linecap="round"/>
            ${label}
          </g>
          <path d="${SHAPE}" fill="none" stroke="#d9f4ff" stroke-opacity=".62" stroke-width="2.5"/>
          <path d="M38 9 L62 9 L62 57 Q62 72 72 82" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
          ${cap}
        </svg>
      </button>`;
  }

  function render() {
    const count = game.tubes.length;
    const columns = count <= 5 ? count : count <= 8 ? 4 : count <= 10 ? 5 : 6;
    $("board").style.setProperty("--columns", columns);
    $("board").innerHTML = game.tubes.map(renderBottle).join("");
  }

  $("board").addEventListener("click", event => {
    const bottle = event.target.closest("[data-bottle]");
    if (bottle && game && !game.busy) tapBottle(Number(bottle.dataset.bottle));
  });

  function tapBottle(index) {
    playTap();

    if (game.selected === null) {
      if (game.tubes[index].length && !isComplete(game.tubes[index])) {
        game.selected = index;
        render();
      }
      return;
    }

    if (game.selected === index) {
      game.selected = null;
      render();
      return;
    }

    if (canPour(game.selected, index)) {
      pour(game.selected, index);
      return;
    }

    if (game.tubes[index].length && !isComplete(game.tubes[index])) {
      game.selected = index;
    } else {
      game.selected = null;
    }
    render();
  }

  function pour(from, to) {
    const source = game.tubes[from];
    const target = game.tubes[to];
    const color = source[source.length - 1];
    let amount = 1;

    while (amount < source.length && source[source.length - 1 - amount] === color) amount++;
    amount = Math.min(amount, CAPACITY - target.length);

    const sourceButton = document.querySelector(`[data-bottle="${from}"]`);
    const targetButton = document.querySelector(`[data-bottle="${to}"]`);
    if (!sourceButton || !targetButton) return;

    const sourceRect = sourceButton.getBoundingClientRect();
    const targetRect = targetButton.getBoundingClientRect();

    game.history.push({
      tubes: game.tubes.map(tube => tube.slice()),
      moves: game.moves,
      score: game.score
    });

    game.selected = null;
    game.busy = true;
    sourceButton.style.visibility = "hidden";

    const flying = sourceButton.cloneNode(true);
    Object.assign(flying.style, {
      position: "fixed",
      left: `${sourceRect.left}px`,
      top: `${sourceRect.top}px`,
      width: `${sourceRect.width}px`,
      height: `${sourceRect.height}px`,
      margin: "0",
      zIndex: "9",
      pointerEvents: "none",
      visibility: "visible",
      transformOrigin: "50% 13%"
    });
    document.body.appendChild(flying);

    const svg = $("pourSvg");
    svg.setAttribute("viewBox", `0 0 ${innerWidth} ${innerHeight}`);
    const stream = document.createElementNS("http://www.w3.org/2000/svg", "path");
    stream.setAttribute("fill", "none");
    stream.setAttribute("stroke", COLORS[color]);
    stream.setAttribute("stroke-width", "7");
    stream.setAttribute("stroke-linecap", "round");
    stream.style.filter = "drop-shadow(0 0 5px #ffffffaa)";
    svg.appendChild(stream);

    const start = performance.now();
    const duration = 760;
    const moveX = targetRect.left - sourceRect.left;
    const moveY = targetRect.top - sourceRect.top;

    function frame(now) {
      if (!game || !game.busy) {
        flying.remove();
        stream.remove();
        return;
      }

      const progress = Math.min(1, (now - start) / duration);
      const travel = Math.min(1, progress / .6);
      const eased = travel * travel * (3 - 2 * travel);
      const tiltProgress = Math.max(0, Math.min(1, (progress - .25) / .42));
      const tilt = Math.sin(tiltProgress * Math.PI) * 48;

      flying.style.left = `${sourceRect.left + moveX * eased}px`;
      flying.style.top = `${sourceRect.top + moveY * eased - Math.sin(eased * Math.PI) * 12}px`;
      flying.style.transform = `rotate(${tilt}deg)`;

      const streamStartX = sourceRect.left + moveX * eased + sourceRect.width * .68;
      const streamStartY = sourceRect.top + moveY * eased + 34;
      const streamEndX = targetRect.left + targetRect.width * .5;
      const streamEndY = targetRect.top + targetRect.height * .68;
      const arc = Math.max(18, Math.abs(streamEndX - streamStartX) * .24);

      if (progress > .35 && progress < .83) {
        stream.style.opacity = "1";
        stream.setAttribute("d", `M ${streamStartX} ${streamStartY} Q ${(streamStartX + streamEndX) / 2} ${Math.min(streamStartY, streamEndY) - arc} ${streamEndX} ${streamEndY}`);
      } else {
        stream.style.opacity = "0";
      }

      if (progress < 1) {
        animationFrame = requestAnimationFrame(frame);
      } else {
        flying.remove();
        stream.remove();
        for (let i = 0; i < amount; i++) game.tubes[to].push(game.tubes[from].pop());

        game.moves++;
        game.score += amount * 10;
        game.busy = false;
        animationFrame = 0;
        render();
        updateStats();

        if (game.tubes[to].length === CAPACITY && game.tubes[to].every(c => c === color)) {
          playCap();
          sparkle(targetRect.left + targetRect.width / 2, targetRect.top + targetRect.height / 2);
        }

        if (game.tubes.every(isComplete)) finishLevel();
      }
    }

    animationFrame = requestAnimationFrame(frame);
  }

  function updateStats() {
    $("levelText").textContent = `${game.level} / 20`;
    $("scoreText").textContent = game.score.toLocaleString("de-DE");
    $("movesText").textContent = String(game.moves);
    $("progressFill").style.width = `${(game.level - 1) / 19 * 100}%`;
    $("soundButton").textContent = soundEnabled ? "🔊" : "🔇";
  }

  function undo() {
    if (game.busy || !game.history.length) {
      showToast("Kein Zug zum Rückgängigmachen.");
      return;
    }

    const previous = game.history.pop();
    game.tubes = previous.tubes.map(tube => tube.slice());
    game.moves = previous.moves;
    game.score = previous.score;
    game.selected = null;
    render();
    updateStats();
    playTap();
  }

  function finishLevel() {
    const bonus = Math.max(0, (game.tubes.length * 8 - game.moves) * 5) + game.level * 25;
    game.score += bonus;
    saved.unlocked = Math.max(saved.unlocked, Math.min(20, game.level + 1));
    saveGame();
    updateStats();

    $("winTitle").textContent = game.level === 20 ? "Alle Level geschafft!" : "Level geschafft!";
    $("winMessage").textContent = `Bonus: ${bonus} Punkte · Gesamt: ${game.score}`;
    $("nextLevelButton").textContent = game.level === 20 ? "Von vorn beginnen" : "Weiter →";
    $("winModal").classList.add("open");
    playWin();
    sparkle(innerWidth / 2, innerHeight / 2);
  }

  function showToast(message) {
    const toast = $("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1500);
  }

  function sparkle(x, y) {
    for (let i = 0; i < 12; i++) {
      const particle = document.createElement("span");
      particle.className = "particle";
      particle.textContent = i % 2 ? "✦" : "✨";
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      particle.style.setProperty("--x", `${Math.cos(i * Math.PI / 6) * 65}px`);
      particle.style.setProperty("--y", `${Math.sin(i * Math.PI / 6) * 65}px`);
      $("particles").appendChild(particle);
      setTimeout(() => particle.remove(), 750);
    }
  }

  function getAudio() {
    if (!soundEnabled) return null;
    try {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    } catch {
      return null;
    }
  }

  function tone(frequency, duration, type = "sine", volume = .04, delay = 0) {
    const context = getAudio();
    if (!context) return;

    const oscillator = context.createOscillator();
    const gain = context.createGain();
    const time = context.currentTime + delay;

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, time);
    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(.001, time + duration);
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start(time);
    oscillator.stop(time + duration);
  }

  function playTap() { tone(480, .05, "sine", .035); }
  function playCap() {
    tone(760, .08, "triangle", .045);
    tone(1120, .12, "sine", .035, .04);
  }
  function playWin() {
    [523,659,784,1047].forEach((frequency,index) => tone(frequency,.22,"sine",.045,index*.13));
  }

  function showLevels() {
    const grid = $("levelGrid");
    grid.innerHTML = "";

    for (let level = 1; level <= 20; level++) {
      const button = document.createElement("button");
      button.className = "level-choice" + (level <= saved.unlocked ? " available" : "");
      button.textContent = level <= saved.unlocked ? String(level) : "🔒";
      button.disabled = level > saved.unlocked;
      button.addEventListener("click", () => startLevel(level));
      grid.appendChild(button);
    }

    $("levelsModal").classList.add("open");
  }

  $("undoButton").addEventListener("click", undo);
  $("restartButton").addEventListener("click", () => startLevel(game.level));
  $("levelsButton").addEventListener("click", showLevels);
  $("closeLevels").addEventListener("click", () => $("levelsModal").classList.remove("open"));

  $("nextLevelButton").addEventListener("click", () => {
    startLevel(game.level === 20 ? 1 : game.level + 1);
  });

  $("soundButton").addEventListener("click", () => {
    soundEnabled = !soundEnabled;
    saved.sound = soundEnabled;
    saveGame();
    updateStats();
    if (soundEnabled) playTap();
  });

  $("fullscreenButton").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      } else if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else {
        showToast("Vollbild ist in diesem Safari-Fenster nicht verfügbar.");
      }
    } catch {
      showToast("Vollbild ist in diesem Safari-Fenster nicht verfügbar.");
    }
  });

  startLevel(1);
})();
</script>
</body>
</html>
